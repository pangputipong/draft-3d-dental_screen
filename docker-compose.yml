version: "3.8"
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - VITE_API_URL=http://<YOUR_SERVER_IP>:8000
    ports:
      - "80:80"
    depends_on:
      - ai_server

  ai_server:
    build:
      context: .
      dockerfile: Dockerfile.ai
    ports:
      - "8000:8000"
    # Uncomment the below lines if you have an NVIDIA GPU on the server
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

